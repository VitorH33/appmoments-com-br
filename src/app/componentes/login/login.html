<main class="form-signin w-100 m-auto">
    
      <img class="mb-4" src="/images/icone.png" alt="" width="80" >
      Moments App - Login
      <h1 class="h3 mb-3 fw-normal">Conecte-se</h1>
  
      <div class="form-floating">
        <input type="text" class="form-control" id="floatingInput" placeholder="name@example.com / 11987654321"/>
        <label for="floatingInput">Email ou telefone</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
        <label for="floatingPassword">Sua Senha</label>
      </div>
  
      
      <button class="btn btn-primary w-100 py-2 mt-2" type="button">Conectar</button>
      <p class="mt-3"><a>Esqueci minha senha</a></p>
      <p class="mt-5 mb-3 text-body-secondary">appmoments.com.br</p>
    
  </main>
