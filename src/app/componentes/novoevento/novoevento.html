<app-navbar></app-navbar>
<div class="container">
    <div class="row mt-3">
        <div class="col-12 text-start">
            <h3>
                <a routerLink="/myevents/"><i class="fa-solid fa-arrow-left"></i> </a>
                Novo Evento
            </h3>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-12">
            <label for="txtNome">Nome do Seu Evento</label>
            <input type="text" class="form-control" [(ngModel)]="evento.titulo">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <label for="txtNome">Data/Hora Inicio</label>
            <input type="datetime-local" class="form-control" [(ngModel)]="evento.dataHoraInicio"
                (focusout)="defineDataFim()">
        </div>
        <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
            <label for="txtNome">Data/Hora Fim</label>
            <input type="datetime-local" disabled class="form-control" [(ngModel)]="evento.dataHoraFim">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-12">
            <label for="txtFrase">Frase que irá aparecer na moldura (max 20 caracteres)</label>
            <input type="text" [(ngModel)]="evento.frase" class="form-control" maxlength="20">
            <span>Caracteres: {{ evento.frase.length }}</span>
        </div>
    </div>

    <div class="row">
        <h4 class="mt-3 mb-2">Escolha sua moldura</h4>
        <div *ngFor="let ITEM of molduras" class="col-6 col-sm-3 col-md-3 col-lg-2 col-xl-2 col-xxl-2">
            <div class="borda" *ngIf="ITEM == selectedItem">
                <img src="/molduras/{{ITEM}}" [alt]="selectedItem" width="100%">
            </div>
            <div class="semborda" *ngIf="ITEM != selectedItem">
                <img src="/molduras/{{ITEM}}" [alt]="selectedItem" width="100%" (click)="selecionarMoldura(ITEM)">
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-6">
            <button class="btn btn-primary" (click)="cadastrarNovoEvento()">Enviar Dados</button>
        </div>
    </div>


</div>
